# Pubblica una release con lo zip pronto da decomprimere in Interface/AddOns/.
# Si attiva quando si fa il push di un tag "vX.Y.Z" uguale alla versione nel .toc:
#   git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica che il tag corrisponda alla versione del .toc
        run: |
          v=$(grep -m1 '^## Version:' PerSempreInItaliano.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Il tag $GITHUB_REF_NAME non corrisponde alla versione nel .toc (v$v)"
            exit 1
          fi

      - name: Crea lo zip
        run: |
          mkdir -p dist/PerSempreInItaliano
          cp PerSempreInItaliano.toc Core.lua Traduzioni.lua Traduzioni_QuestIT.lua Data_Esempi.lua README.md LICENSE LICENSE-QuestIT LICENSE-QuestIT-traduzioni.txt CREDITS.md dist/PerSempreInItaliano/
          cp -r Media dist/PerSempreInItaliano/
          cd dist
          zip -r "PerSempreInItaliano-${GITHUB_REF_NAME#v}.zip" PerSempreInItaliano
          cp "PerSempreInItaliano-${GITHUB_REF_NAME#v}.zip" PerSempreInItaliano.zip

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          proprie=$(grep -c '^T\[' Traduzioni.lua)
          questit=$(grep -c '^T\[' Traduzioni_QuestIT.lua || true)
          quest=$((proprie + questit))
          dialoghi=$(grep -c '^G\[' Traduzioni.lua)
          {
            echo "## Traduzioni incluse"
            echo
            echo "- **$quest quest** tradotte ($proprie nostre, $questit importate da QuestIT)"
            echo "- **$dialoghi dialoghi** tradotti"
            echo
            echo "## Installazione"
            echo
            echo "Scarica **PerSempreInItaliano.zip** e decomprimilo nella cartella Interface/AddOns del client: deve comparire la cartella PerSempreInItaliano."
          } > note.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file note.md \
            --generate-notes

  curseforge:
    # Carica anche su CurseForge. Se fallisce (es. progetto non ancora approvato) la release
    # su GitHub resta valida: si rilancia dalla scheda Actions.
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
